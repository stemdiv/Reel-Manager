<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel — Quota &amp; Revenue Estimator</title>
<!-- AUD-08 — this page shares the app's origin, so it gets a CSP of its own. The one inline
     script is allowed by its hash, not by 'unsafe-inline': after editing it, update the hash
     (tests.html, AUD-08, prints the expected value). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-i/zIQ7LqRiHy0Nc7OFSLRbxuycWtfVGJRaJ0+GmS8F0='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<!-- AUD-09 — Chart.js is served from this origin, not a CDN: a CDN response runs with this origin's
     access to the app's IndexedDB and localStorage. npm chart.js@4.4.1, dist/chart.umd.js, unmodified. -->
<script src="vendor/chart.umd-4.4.1.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG"></script>
<style>
  /* Dark is the default; the light set overrides the same tokens, so every
     rule below is written once and theming is a single attribute on <html>. */
  :root{
    --bg-0:#0a0b0d; --bg-1:#0f1115; --bg-2:#15181d; --bg-3:#1c2026;
    --line:#2a2f37; --line-2:#353b45;
    --fg-0:#ededec; --fg-1:#b9bbc0; --fg-2:#7a7d85;
    --accent:#f2664a; --accent-soft:rgba(242,102,74,.14); --accent-line:rgba(242,102,74,.45);
    --ok:#4ec98a; --warn:#e0b03a; --danger:#e2564a; --info:#5aa9e6;
    --grid:rgba(42,47,55,.55); --tick:#7a7d85;
    --r:12px; --r-lg:16px;
  }
  :root[data-theme="light"]{
    --bg-0:#f4f5f7; --bg-1:#ffffff; --bg-2:#f7f8fa; --bg-3:#eceef2;
    --line:#dde0e6; --line-2:#c7cbd4;
    --fg-0:#14161a; --fg-1:#474d58; --fg-2:#6d727d;
    --accent:#d1462b; --accent-soft:rgba(209,70,43,.10); --accent-line:rgba(209,70,43,.40);
    --ok:#1c8a53; --warn:#9a6f0c; --danger:#c0392b; --info:#1f6fb2;
    --grid:rgba(0,0,0,.08); --tick:#6d727d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:var(--bg-0);color:var(--fg-0);line-height:1.5;-webkit-font-smoothing:antialiased;padding:26px 18px 60px;
    transition:background .18s,color .18s}
  .wrap{max-width:1180px;margin:0 auto}
  .topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
  h1{font-size:25px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#ff8a63);
    display:grid;place-items:center;color:#180a06;font-weight:800;font-size:15px}
  .switches{display:flex;gap:8px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;cursor:pointer;border:none;
    background:transparent;color:var(--fg-2);transition:.15s}
  .seg button:hover{color:var(--fg-0)}
  .seg button.on{background:var(--accent-soft);color:var(--accent)}
  .sub{color:var(--fg-1);font-size:14.5px;margin-bottom:6px;max-width:82ch}
  .stamp{color:var(--fg-2);font-size:12px;margin-bottom:20px;max-width:82ch}
  .stamp code{color:var(--fg-1)}
  .grid{display:grid;grid-template-columns:365px 1fr;gap:20px;align-items:start}
  .panel{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:14px}
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .preset{font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;
    background:var(--bg-2);border:1px solid var(--line-2);color:var(--fg-1);transition:.15s}
  .preset:hover{border-color:var(--accent-line);color:var(--fg-0)}
  .presetnote{font-size:11.5px;color:var(--fg-2);margin-bottom:18px;line-height:1.45}
  .presetnote b{color:var(--fg-1)}
  .field{margin-bottom:15px}
  .field label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--fg-1);margin-bottom:5px;gap:8px}
  .field label .val{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  .field input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  .field .hint{font-size:11.5px;color:var(--fg-2);margin-top:3px}
  .grp{border-top:1px solid var(--line);margin:16px 0 14px;padding-top:14px}
  .grp:first-of-type{border:none;margin-top:0;padding-top:0}
  .grp .gt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);margin-bottom:10px}
  .bk{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

  /* Tier mix grid — the single input that drives both dashboards. */
  .mix{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
  .mix th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2);font-weight:600;
    padding:0 3px 6px;text-align:center}
  .mix th:first-child{text-align:left}
  .mix td{padding:3px 3px}
  .mix td:first-child{color:var(--fg-1);font-weight:600;white-space:nowrap;font-size:12px}
  .mix input{width:100%;min-width:0;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;text-align:right;
    background:var(--bg-2);border:1px solid var(--line);border-radius:6px;color:var(--fg-0);padding:5px 6px}
  .mix input:focus{outline:none;border-color:var(--accent-line)}
  .mixsum{font-size:11.5px;color:var(--fg-2);margin-bottom:4px}
  .mixsum.bad{color:var(--warn)}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--fg-1);margin-bottom:6px}
  .chk input{accent-color:var(--accent);margin-top:3px;cursor:pointer}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .card .k{font-size:12px;color:var(--fg-2);margin-bottom:6px}
  .card .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .card .v small{font-size:13px;color:var(--fg-2);font-weight:500}
  .card .pct{font-size:12px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
  .card.hero{grid-column:1/-1;background:linear-gradient(120deg,var(--accent-soft),transparent);border-color:var(--accent-line)}
  .card.hero .v{font-size:26px}
  .card.hero .why{font-size:13px;color:var(--fg-1);margin-top:7px;font-weight:400}
  .chartbox{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:18px}
  .chartbox h3{font-size:14px;margin-bottom:4px;color:var(--fg-1)}
  .chartbox .h3sub{font-size:12px;color:var(--fg-2);margin-bottom:12px;max-width:88ch}
  table.out{width:100%;border-collapse:collapse;font-size:13px}
  .out th,.out td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
  .out th:first-child,.out td:first-child{text-align:left}
  .out th{color:var(--fg-2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  .out td{font-variant-numeric:tabular-nums;color:var(--fg-1)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .exports{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;
    background:var(--bg-2);border:1px solid var(--line-2);color:var(--fg-0);transition:.15s}
  .btn:hover{border-color:var(--accent-line)}
  .btn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .exports .note{font-size:12px;color:var(--fg-2)}
  .toast{font-size:12.5px;color:var(--ok);opacity:0;transition:opacity .2s}
  .toast.on{opacity:1}
  .notes{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-top:18px;font-size:13px;color:var(--fg-1)}
  .notes h3{font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .notes li{margin:0 0 7px 18px}
  .hidden{display:none}
  @media(max-width:880px){ .grid{grid-template-columns:1fr} .cards{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1><span class="dot">R</span><span data-i18n="title"></span></h1>
    </div>
    <div class="switches">
      <div class="seg" id="seg_mode">
        <button data-mode="quota" data-i18n="modeQuota"></button>
        <button data-mode="finance" data-i18n="modeFinance"></button>
      </div>
      <div class="seg" id="seg_lang">
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
      <div class="seg" id="seg_theme">
        <button data-theme="light" data-i18n="themeLight"></button>
        <button data-theme="dark" data-i18n="themeDark"></button>
      </div>
    </div>
  </div>
  <p class="sub" id="sub_quota"></p>
  <p class="sub hidden" id="sub_finance"></p>
  <p class="stamp" data-i18n="stamp"></p>

  <div class="grid">
    <!-- CONTROLS -->
    <div class="panel">
      <h2 data-i18n="assumptions"></h2>
      <div class="presets" id="presets">
        <button class="preset" data-preset="conservative" data-i18n="pConservative"></button>
        <button class="preset" data-preset="base" data-i18n="pBase"></button>
        <button class="preset" data-preset="optimistic" data-i18n="pOptimistic"></button>
        <button class="preset" data-preset="viral" data-i18n="pViral"></button>
      </div>
      <p class="presetnote" data-i18n="presetNote"></p>

      <div class="grp"><div class="gt" data-i18n="gGrowth"></div>
        <div class="field"><label><span data-i18n="fStart"></span> <span class="val" id="v_start"></span></label>
          <input type="range" id="start" min="50" max="20000" step="50"><div class="hint" data-i18n="hStart"></div></div>
        <div class="field"><label><span data-i18n="fGrowth"></span> <span class="val" id="v_growth"></span></label>
          <input type="range" id="growth" min="0" max="60" step="1"><div class="hint" data-i18n="hGrowth"></div></div>
        <div class="field"><label><span data-i18n="fMonths"></span> <span class="val" id="v_months"></span></label>
          <input type="range" id="months" min="6" max="36" step="1"></div>
        <div class="field"><label><span data-i18n="fDau"></span> <span class="val" id="v_dau"></span></label>
          <input type="range" id="dau" min="5" max="100" step="1"><div class="hint" data-i18n="hDau"></div></div>
      </div>

      <div class="grp"><div class="gt" data-i18n="gMix"></div>
        <p class="presetnote" style="margin-bottom:10px" data-i18n="mixNote"></p>
        <table class="mix">
          <thead><tr>
            <th data-i18n="colTier"></th><th data-i18n="colShare"></th><th data-i18n="colPrice"></th>
            <th data-i18n="colReads"></th><th data-i18n="colWrites"></th><th data-i18n="colSearch"></th>
          </tr></thead>
          <tbody id="mixbody"></tbody>
        </table>
        <div class="mixsum" id="mixsum"></div>
      </div>

      <div class="grp"><div class="gt" data-i18n="gLifetime"></div>
        <div class="field"><label><span data-i18n="fLtSales"></span> <span class="val" id="v_ltsales"></span></label>
          <input type="range" id="ltsales" min="0" max="200" step="1"><div class="hint" data-i18n="hLtSales"></div></div>
        <div class="field"><label><span data-i18n="fLtPrice"></span> <span class="val" id="v_ltprice"></span></label>
          <input type="range" id="ltprice" min="0" max="400" step="1"><div class="hint" data-i18n="hLtPrice"></div></div>
        <div class="field"><label><span data-i18n="fLtAmort"></span> <span class="val" id="v_ltamort"></span></label>
          <input type="range" id="ltamort" min="6" max="60" step="1"><div class="hint" data-i18n="hLtAmort"></div></div>
        <label class="chk"><input type="checkbox" id="ltbyo"><span data-i18n="fLtByo"></span></label>
      </div>

      <div class="grp"><div class="gt" data-i18n="gBilling"></div>
        <div class="field"><label><span data-i18n="fAnnual"></span> <span class="val" id="v_annual"></span></label>
          <input type="range" id="annual" min="0" max="100" step="5"><div class="hint" data-i18n="hAnnual"></div></div>
      </div>

      <div class="grp"><div class="gt" data-i18n="gUsage"></div>
        <div class="field"><label><span data-i18n="fPages"></span> <span class="val" id="v_pages"></span></label>
          <input type="range" id="pages" min="1" max="4" step="1"><div class="hint" data-i18n="hPages"></div></div>
        <div class="field"><label><span data-i18n="fSps"></span> <span class="val" id="v_sps"></span></label>
          <input type="range" id="sps" min="0" max="3" step="0.1"><div class="hint" data-i18n="hSps"></div></div>
        <div class="field"><label><span data-i18n="fUploads"></span> <span class="val" id="v_uploads"></span></label>
          <input type="range" id="uploads" min="0" max="5" step="0.1"><div class="hint" data-i18n="hUploads"></div></div>
        <div class="field"><label><span data-i18n="fCache"></span> <span class="val" id="v_cache"></span></label>
          <input type="range" id="cache" min="0" max="90" step="5"><div class="hint" data-i18n="hCache"></div></div>
      </div>

      <div class="grp"><div class="gt" data-i18n="gLimits"></div>
        <div class="field"><label>Pool <span class="val" id="v_qpool"></span></label>
          <input type="range" id="qpool" min="10000" max="1000000" step="10000"><div class="hint" data-i18n="hQpool"></div></div>
        <div class="field"><label>search.list <span class="val" id="v_qsearch"></span></label>
          <input type="range" id="qsearch" min="100" max="20000" step="100"><div class="hint" data-i18n="hQsearch"></div></div>
        <div class="field"><label>videos.insert <span class="val" id="v_qupload"></span></label>
          <input type="range" id="qupload" min="100" max="20000" step="100"><div class="hint" data-i18n="hQupload"></div></div>
        <div class="field"><label>batchGetStats <span class="val" id="v_qstats"></span></label>
          <input type="range" id="qstats" min="10000" max="1000000" step="10000"><div class="hint" data-i18n="hQstats"></div></div>
        <div class="field"><label><span data-i18n="fMargin"></span> <span class="val" id="v_margin"></span></label>
          <input type="range" id="margin" min="0" max="100" step="5"><div class="hint" data-i18n="hMargin"></div></div>
      </div>
    </div>

    <!-- RESULTS -->
    <div>
      <!-- QUOTA VIEW -->
      <div id="view_quota">
        <div class="cards">
          <div class="card hero"><div class="k" data-i18n="binding"></div><div class="v" id="hero_v">—</div><div class="why" id="hero_w"></div></div>
          <div class="card"><div class="k"><span class="bk" style="background:#f2664a"></span>Pool <span data-i18n="atHorizon"></span></div><div class="v" id="c_pool">—</div><div class="pct" id="p_pool"></div></div>
          <div class="card"><div class="k"><span class="bk" style="background:#5aa9e6"></span>search.list <span data-i18n="atHorizon"></span></div><div class="v" id="c_search">—</div><div class="pct" id="p_search"></div></div>
          <div class="card"><div class="k"><span class="bk" style="background:#e0b03a"></span>videos.insert <span data-i18n="atHorizon"></span></div><div class="v" id="c_upload">—</div><div class="pct" id="p_upload"></div></div>
          <div class="card"><div class="k"><span class="bk" style="background:#4ec98a"></span>batchGetStats <span data-i18n="atHorizon"></span></div><div class="v" id="c_stats">—</div><div class="pct" id="p_stats"></div></div>
        </div>
        <div class="chartbox">
          <h3 data-i18n="chartQTitle"></h3>
          <div class="h3sub" data-i18n="chartQSub"></div>
          <canvas id="chartQ" height="150"></canvas>
        </div>
        <div class="chartbox">
          <h3 data-i18n="tableQTitle"></h3>
          <div class="h3sub" data-i18n="tableQSub"></div>
          <table class="out" id="buckettable">
            <thead><tr><th data-i18n="thBucket"></th><th data-i18n="thLimit"></th><th data-i18n="thEffToday"></th><th data-i18n="thEffHorizon"></th><th data-i18n="thGrossHorizon"></th><th data-i18n="thSaturates"></th><th data-i18n="thRequest"></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="notes"><h3 data-i18n="howToRead"></h3><ul id="notesQ"></ul></div>
      </div>

      <!-- FINANCE VIEW -->
      <div id="view_finance" class="hidden">
        <div class="cards">
          <div class="card hero"><div class="k" data-i18n="revCeiling"></div><div class="v" id="fhero_v">—</div><div class="why" id="fhero_w"></div></div>
          <div class="card"><div class="k" data-i18n="cMrrNow"></div><div class="v" id="f_mrrnow">—</div><div class="pct" id="f_arpunow"></div></div>
          <div class="card"><div class="k" data-i18n="cMrrHorizon"></div><div class="v" id="f_mrrend">—</div><div class="pct" id="f_arrend"></div></div>
          <div class="card"><div class="k" data-i18n="cCash"></div><div class="v" id="f_cash">—</div><div class="pct" id="f_ltcash"></div></div>
          <div class="card"><div class="k" data-i18n="cPaying"></div><div class="v" id="f_paying">—</div><div class="pct" id="f_payshare"></div></div>
        </div>
        <div class="chartbox">
          <h3 data-i18n="chartFTitle"></h3>
          <div class="h3sub" data-i18n="chartFSub"></div>
          <canvas id="chartF" height="150"></canvas>
        </div>
        <div class="chartbox">
          <h3 data-i18n="tableFTitle"></h3>
          <div class="h3sub" data-i18n="tableFSub"></div>
          <table class="out" id="revtable">
            <thead><tr><th data-i18n="thTier"></th><th data-i18n="thShare"></th><th data-i18n="thUsersH"></th><th data-i18n="thPrice"></th><th data-i18n="thMrrH"></th><th data-i18n="thMrrPct"></th><th data-i18n="thSearchLoad"></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="notes"><h3 data-i18n="howToRead"></h3><ul id="notesF"></ul></div>
      </div>

      <div class="exports">
        <button class="btn primary" id="btn_csv" data-i18n="btnCsv"></button>
        <button class="btn" id="btn_tsv" data-i18n="btnTsv"></button>
        <span class="note" data-i18n="exportNote"></span>
        <span class="toast" id="toast"></span>
      </div>
    </div>
  </div>
</div>

<script>
// ═══ Quota model (YouTube Data API, rules of 1 and 3 June 2026) ═════════════
// Pool costs are in units; the three granular buckets are counted in CALLS.
const COST_READ = 1, COST_WRITE = 50;
const BUCKETS = [
  { key:'pool',   label:'Pool (all other methods)', color:'#f2664a' },
  { key:'search', label:'search.list',              color:'#5aa9e6' },
  { key:'upload', label:'videos.insert',            color:'#e0b03a' },
  { key:'stats',  label:'videos.batchGetStats',     color:'#4ec98a' }
];

// ═══ Plan mix — the single input driving both dashboards ════════════════════
// Names and prices come from Strategie-Prix-et-Offres.docx (9 July 2026); the
// daily Discover caps in that document (3 / 15 / 50 / 200) are ceilings, so the
// defaults below sit under them — a capped user is not a saturated user.
// Everything here is editable: the monetisation is not frozen.
const TIERS = [
  { key:'free',     color:'#8a8f99', cap:3 },
  { key:'standard', color:'#5aa9e6', cap:15 },
  { key:'premium',  color:'#4ec98a', cap:50 },
  { key:'pro',      color:'#e0b03a', cap:200 }
];
const TIER_FIELDS = ['share','price','reads','writes','search'];

const RANGE_IDS = ["start","growth","months","dau","ltsales","ltprice","ltamort","annual",
                   "pages","sps","uploads","cache","qpool","qsearch","qupload","qstats","margin"];

const PRESETS = {
  conservative:{start:150,growth:8,months:24,dau:30,ltsales:2,ltprice:79,ltamort:24,annual:20,
    pages:1,sps:1,uploads:0,cache:65,qpool:10000,qsearch:100,qupload:100,qstats:10000,margin:40,ltbyo:false,
    mix:{free:[97,0,20,2,2], standard:[2,3,45,6,8], premium:[0.8,6,70,10,20], pro:[0.2,12,110,18,60]}},

let LANG = 'fr', MODE = 'quota';
const el = id => document.getElementById(id);
const t = k => (I18N[LANG][k] !== undefined ? I18N[LANG][k] : k);
const tf = (k, ...a) => String(t(k)).replace(/\{(\d)\}/g, (_, i) => a[i]);

// Number formatting follows the active language, so 10 000 reads as it should
// in French and as 10,000 in English.
const loc = () => LANG === 'fr' ? 'fr-FR' : 'en-US';
const fmt = n => Math.round(n).toLocaleString(loc());
const fmtK = n => n >= 1000
  ? (n/1000).toLocaleString(loc(), {maximumFractionDigits: n >= 100000 ? 0 : 1}) + 'K'
  : Math.round(n).toString();
const eur = n => Math.round(n).toLocaleString(loc()) + ' €';
const eurK = n => n >= 10000 ? Math.round(n/1000).toLocaleString(loc()) + 'K €' : eur(n);

// ═══ Inputs ═════════════════════════════════════════════════════════════════
function tierInputId(tier, field){ return 'm_' + field + '_' + tier; }

function buildMixRows(){
  const body = el('mixbody');
  body.innerHTML = '';
  TIERS.forEach(tier => {
    const tr = document.createElement('tr');
    let cells = '<td><span class="bk" style="background:' + tier.color + '"></span>'
      + '<span data-i18n="' + tier.key + '"></span></td>';
    TIER_FIELDS.forEach(f => {
      const step = (f === 'share') ? '0.1' : (f === 'price' ? '0.5' : '1');
      cells += '<td><input type="number" min="0" step="' + step + '" id="' + tierInputId(tier.key, f) + '"></td>';
    });
    tr.innerHTML = cells;
    body.appendChild(tr);
  });
}

function readInputs(){
  const o = {};
  RANGE_IDS.forEach(id => o[id] = parseFloat(el(id).value));
  o.ltbyo = el('ltbyo').checked;
  o.mix = {};
  TIERS.forEach(tier => {
    o.mix[tier.key] = {};
    TIER_FIELDS.forEach(f => {
      const v = parseFloat(el(tierInputId(tier.key, f)).value);
      o.mix[tier.key][f] = isFinite(v) && v >= 0 ? v : 0;
    });
  });
  return o;
}

function labels(o){
  el('v_start').textContent = fmt(o.start);
  el('v_growth').textContent = o.growth + ' %/' + (LANG === 'fr' ? 'mois' : 'mo');
  el('v_months').textContent = o.months + ' ' + (LANG === 'fr' ? 'mois' : 'mo');
  el('v_dau').textContent = o.dau + ' %';
  el('v_ltsales').textContent = fmt(o.ltsales) + ' /' + (LANG === 'fr' ? 'mois' : 'mo');
  el('v_ltprice').textContent = eur(o.ltprice);
  el('v_ltamort').textContent = o.ltamort + ' ' + (LANG === 'fr' ? 'mois' : 'mo');
  el('v_annual').textContent = o.annual + ' %';
  el('v_pages').textContent = o.pages;
  el('v_sps').textContent = o.sps.toFixed(1);
  el('v_uploads').textContent = o.uploads.toFixed(1);
  el('v_cache').textContent = o.cache + ' %';
  el('v_qpool').textContent = fmtK(o.qpool);
  el('v_qsearch').textContent = fmt(o.qsearch);
  el('v_qupload').textContent = fmt(o.qupload);
  el('v_qstats').textContent = fmtK(o.qstats);
  el('v_margin').textContent = o.margin + ' %';

// is a work in progress, not an error, and the projection stays readable.

  const raw = TIERS.map(x => o.mix[x.key].share);
  const sum = raw.reduce((a, b) => a + b, 0);
  const out = {};
  TIERS.forEach((tier, i) => out[tier.key] = sum > 0 ? raw[i] / sum : (tier.key === 'free' ? 1 : 0));
  return { shares: out, sum };
}

function project(o){
  const { shares, sum } = normalisedMix(o);
  const c = o.cache / 100;
  const annualFactor = 1 - (o.annual / 100) * (2 / 12); // two months free on the annual share
  const rows = [];
  let cumCash = 0;

  for (let m = 0; m <= o.months; m++){
    const users = o.start * Math.pow(1 + o.growth / 100, m);
    const dau = users * (o.dau / 100);

    // Lifetime licences accumulate as their own cohort, on top of the mix.
    const ltUsers = o.ltsales * m;
    const ltDau = ltUsers * (o.dau / 100);

    const gross = { pool:0, search:0, upload:0, stats:0 };
    const eff   = { pool:0, search:0, upload:0, stats:0 };
    const perTier = {};
    let mrr = 0;

    TIERS.forEach(tier => {
      const p = o.mix[tier.key];
      const tUsers = users * shares[tier.key];
      const tDau = dau * shares[tier.key];
      const searchCalls = p.search * o.pages;
      const statsCalls = p.search * o.sps;
      const uploads = tier.key === 'pro' ? o.uploads : 0;

      const gPool = p.reads * COST_READ + p.writes * COST_WRITE;
      gross.pool   += tDau * gPool;
      gross.search += tDau * searchCalls;
      gross.stats  += tDau * statsCalls;
      gross.upload += tDau * uploads;
      eff.pool   += tDau * (p.reads * COST_READ * (1 - c) + p.writes * COST_WRITE);
      eff.search += tDau * searchCalls * (1 - c);
      eff.stats  += tDau * statsCalls * (1 - c);
      eff.upload += tDau * uploads;

      // Only paid plans carry the annual discount.
      const rev = tUsers * p.price * (p.price > 0 ? annualFactor : 1);
      mrr += rev;
      perTier[tier.key] = { users: tUsers, dau: tDau, revenue: rev, searchCalls: tDau * searchCalls * (1 - c) };
    });

    // Lifetime holders consume like a Pro unless they are on their own quota.
    if (!o.ltbyo && ltDau > 0){
      const p = o.mix.pro;
      const searchCalls = p.search * o.pages, statsCalls = p.search * o.sps;
      gross.pool   += ltDau * (p.reads * COST_READ + p.writes * COST_WRITE);
      gross.search += ltDau * searchCalls;
      gross.stats  += ltDau * statsCalls;
      gross.upload += ltDau * o.uploads;
      eff.pool   += ltDau * (p.reads * COST_READ * (1 - c) + p.writes * COST_WRITE);
      eff.search += ltDau * searchCalls * (1 - c);
      eff.stats  += ltDau * statsCalls * (1 - c);
      eff.upload += ltDau * o.uploads;
    }

    const ltMrr = o.ltamort > 0 ? (ltUsers * o.ltprice) / o.ltamort : 0;
    const ltCashIn = o.ltsales * o.ltprice;
    const cashIn = mrr + ltCashIn;
    cumCash += cashIn;

    const payingUsers = TIERS.reduce((a, tier) =>
      a + (o.mix[tier.key].price > 0 ? perTier[tier.key].users : 0), 0) + ltUsers;

    rows.push({ m, users: users + ltUsers, baseUsers: users, ltUsers, dau: dau + ltDau,
      gross, eff, perTier, mrr, ltMrr, totalMrr: mrr + ltMrr, ltCashIn, cashIn, cumCash, payingUsers });
  }
  return { rows, mixSum: sum, shares };
}

function saturationMonth(rows, key, limit){
  const hit = rows.find(r => r.eff[key] >= limit);
  return hit ? hit.m : null;
}
function bucketUnit(key){ return key === 'pool' ? t('unitsDay') : t('callsDay'); }
function bucketUnitShort(key){ return key === 'pool' ? t('unitsD') : t('callsD'); }

// ═══ Render ═════════════════════════════════════════════════════════════════
let chartQ, chartF, lastModel = null;

function chartTheme(){
  const cs = getComputedStyle(document.documentElement);
  return { grid: cs.getPropertyValue('--grid').trim(), tick: cs.getPropertyValue('--tick').trim() };
}

function render(){
  const o = readInputs();
  labels(o);
  const { rows, mixSum } = project(o);
  const lim = { pool:o.qpool, search:o.qsearch, upload:o.qupload, stats:o.qstats };
  const end = rows[rows.length - 1], now = rows[0];
  const margin = 1 + o.margin / 100;
  const leadIdx = Math.min(9, o.months);

  const sumRounded = Math.round(mixSum * 10) / 10;
  const sumEl = el('mixsum');
  const off = Math.abs(mixSum - 100) > 0.05;
  sumEl.textContent = off ? tf('mixBad', sumRounded.toLocaleString(loc())) : tf('mixOk', sumRounded.toLocaleString(loc()));
  sumEl.classList.toggle('bad', off);

  const summary = BUCKETS.map(b => {
    const sat = saturationMonth(rows, b.key, lim[b.key]);
    const ratioEnd = lim[b.key] > 0 ? end.eff[b.key] / lim[b.key] : 0;
    return { key:b.key, label:b.label, color:b.color, unit:bucketUnit(b.key),
      limit:lim[b.key], effNow:now.eff[b.key], effEnd:end.eff[b.key], grossEnd:end.gross[b.key],
      sat, ratioEnd, request: rows[leadIdx].gross[b.key] * margin };
  });

  const saturating = summary.filter(s => s.sat !== null).sort((a, b) => a.sat - b.sat || b.ratioEnd - a.ratioEnd);
  const worst = summary.slice().sort((a, b) => b.ratioEnd - a.ratioEnd)[0];
  const first = saturating.length ? saturating[0] : null;

  lastModel = { o, rows, summary, leadIdx, margin, first, lim };

  renderQuota(o, rows, summary, first, worst);
  renderFinance(o, rows, summary, first);
}

function renderQuota(o, rows, summary, first, worst){
  if (first){
    const r = rows[first.sat];
    el('hero_v').innerHTML = first.label + ' <small>' + tf('saturatesAt', first.sat) + '</small>';
    el('hero_w').textContent = tf('bindingWhy', fmt(r.eff[first.key]), first.unit, fmt(first.limit),
      fmt(r.users), fmt(first.request));
  } else {
    el('hero_v').innerHTML = tf('noSaturation', o.months);
    el('hero_w').textContent = tf('closest', worst.label, fmt(worst.ratioEnd * 100));
  }

  summary.forEach(s => {
    el('c_' + s.key).innerHTML = fmt(s.effEnd) + ' <small>' + bucketUnitShort(s.key) + '</small>';
    const pct = Math.round(s.ratioEnd * 100);
    const col = pct >= 100 ? 'var(--danger)' : pct >= 70 ? 'var(--warn)' : 'var(--ok)';
    el('p_' + s.key).innerHTML = '<span style="color:' + col + '">' + tf('pctOf', fmt(pct), fmt(s.limit)) + '</span>';
  });

  const tbody = el('buckettable').querySelector('tbody');
  tbody.innerHTML = '';
  summary.forEach(s => {
    const tr = document.createElement('tr');
    const satCell = s.sat === null
      ? '<td style="color:var(--ok)">' + tf('notBefore', o.months) + '</td>'
      : '<td style="color:' + (s.sat <= 6 ? 'var(--danger)' : 'var(--warn)') + '"><b>' + tf('monthN', s.sat) + '</b></td>';
    tr.innerHTML = '<td><span class="tag" style="background:' + s.color + '22;color:' + s.color + '">' + s.label + '</span></td>'
      + '<td>' + fmt(s.limit) + '</td><td>' + fmt(s.effNow) + '</td><td>' + fmt(s.effEnd) + '</td>'
      + '<td>' + fmt(s.grossEnd) + '</td>' + satCell + '<td><b>' + fmt(s.request) + '</b></td>';
    tbody.appendChild(tr);
  });

  const th = chartTheme();
  const labelsX = rows.map(r => 'm' + r.m);
  const ds = BUCKETS.map(b => ({
    label: b.label,
    data: rows.map(r => lastModel.lim[b.key] > 0
      ? Math.max(0.1, Math.round(r.eff[b.key] / lastModel.lim[b.key] * 1000) / 10) : 0.1),
    borderColor: b.color, borderWidth:2, pointRadius:0, fill:false, tension:.25
  }));
  ds.push({ label:'100%', data: rows.map(() => 100), borderColor:'rgba(226,86,74,.6)',
    borderWidth:1.5, borderDash:[5,4], pointRadius:0, fill:false });
  const cfg = { type:'line', data:{ labels:labelsX, datasets:ds }, options:{
    responsive:true, interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ labels:{ color: th.tick } },
      tooltip:{ callbacks:{ label: c => c.dataset.label + ': ' + c.parsed.y + '%' } } },
    scales:{
      x:{ ticks:{ color: th.tick }, grid:{ color: th.grid } },
      y:{ type:'logarithmic', ticks:{ color: th.tick, callback: v => v + '%' }, grid:{ color: th.grid } }
    }
  }};
  // Data only on an update: replacing options makes Chart.js replay the whole
  // entry animation, which reads as the curves collapsing on every keystroke.
  // A theme change destroys both charts instead, so colours still follow.
  if (chartQ){ chartQ.data = cfg.data; chartQ.update('none'); }
  else { chartQ = new Chart(el('chartQ'), cfg); }
}

function renderFinance(o, rows, summary, first){
  const end = rows[rows.length - 1], now = rows[0];

  if (first){
    const r = rows[first.sat];
    el('fhero_v').innerHTML = tf('mrrAt', eur(r.totalMrr), first.sat);
    el('fhero_w').textContent = tf('ceilingWhy', first.label,
      fmt(r.eff[first.key]) + ' ' + first.unit, fmt(first.limit) + ' ' + first.unit);
  } else {
    el('fhero_v').innerHTML = eur(end.totalMrr) + ' <small>' + t('cMrrHorizon').toLowerCase() + '</small>';
    el('fhero_w').textContent = tf('ceilingNone', o.months);
  }

  el('f_mrrnow').innerHTML = eur(now.totalMrr);
  el('f_arpunow').textContent = tf('arpuLabel', (now.users > 0 ? (now.totalMrr / now.users) : 0).toFixed(2) + ' €');
  el('f_mrrend').innerHTML = eurK(end.totalMrr);
  el('f_arrend').textContent = tf('arrLabel', eurK(end.totalMrr * 12));
  el('f_cash').innerHTML = eurK(end.cumCash);
  const ltCashTotal = rows.reduce((a, r) => a + r.ltCashIn, 0);
  el('f_ltcash').textContent = tf('ltCashLabel', eurK(ltCashTotal));
  el('f_paying').innerHTML = fmt(end.payingUsers);
  el('f_payshare').textContent = tf('payShareLabel',
    (end.users > 0 ? (end.payingUsers / end.users * 100) : 0).toFixed(1));

  const tbody = el('revtable').querySelector('tbody');
  tbody.innerHTML = '';
  TIERS.forEach(tier => {
    const pt = end.perTier[tier.key], p = o.mix[tier.key];
    const pct = end.totalMrr > 0 ? pt.revenue / end.totalMrr * 100 : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><span class="tag" style="background:' + tier.color + '22;color:' + tier.color + '">' + t(tier.key) + '</span></td>'
      + '<td>' + p.share.toLocaleString(loc()) + ' %</td><td>' + fmt(pt.users) + '</td>'
      + '<td>' + eur(p.price) + '</td><td>' + eurK(pt.revenue) + '</td>'
      + '<td>' + pct.toFixed(1) + ' %</td><td>' + fmt(pt.searchCalls) + '</td>';
    tbody.appendChild(tr);
  });
  // Lifetime sits outside the mix: a cohort, not a share.
  const ltPct = end.totalMrr > 0 ? end.ltMrr / end.totalMrr * 100 : 0;
  const trLt = document.createElement('tr');
  trLt.innerHTML = '<td><span class="tag" style="background:var(--accent-soft);color:var(--accent)">' + t('lifetime') + '</span></td>'
    + '<td>—</td><td>' + fmt(end.ltUsers) + '</td><td>' + eur(o.ltprice) + '</td>'
    + '<td>' + eurK(end.ltMrr) + '</td><td>' + ltPct.toFixed(1) + ' %</td>'
    + '<td>' + (o.ltbyo ? '0 (BYO)' : fmt(end.ltUsers * (o.dau / 100) * o.mix.pro.search * o.pages * (1 - o.cache / 100))) + '</td>';
  tbody.appendChild(trLt);

  const th = chartTheme();
  const labelsX = rows.map(r => 'm' + r.m);
  const ds = TIERS.filter(tier => o.mix[tier.key].price > 0).map(tier => ({
    type:'bar', label: t(tier.key), data: rows.map(r => Math.round(r.perTier[tier.key].revenue)),
    backgroundColor: tier.color + 'cc', stack:'rev', borderWidth:0
  }));
  ds.push({ type:'bar', label: t('lifetime'), data: rows.map(r => Math.round(r.ltMrr)),
    backgroundColor:'#f2664acc', stack:'rev', borderWidth:0 });
  ds.push({ type:'line', label: t('cCash'), data: rows.map(r => Math.round(r.cumCash)),
    borderColor:'#5aa9e6', borderWidth:2, pointRadius:0, fill:false, tension:.25, yAxisID:'y2' });

  // Mixed chart: Chart.js v4 still needs a base type on the config, even when
  // every dataset carries its own. Without it nothing is drawn but the axes.
  const cfg = { type:'bar', data:{ labels:labelsX, datasets:ds }, options:{
    responsive:true, interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ labels:{ color: th.tick } },
      tooltip:{ callbacks:{ label: c => c.dataset.label + ': ' + eur(c.parsed.y) } } },
    scales:{
      x:{ stacked:true, ticks:{ color: th.tick }, grid:{ color: th.grid } },
      y:{ stacked:true, position:'left', ticks:{ color: th.tick, callback: v => eurK(v) }, grid:{ color: th.grid } },
      y2:{ position:'right', ticks:{ color: th.tick, callback: v => eurK(v) }, grid:{ display:false } }
    }
  }};
  if (chartF){ chartF.data = cfg.data; chartF.update('none'); }
  else { chartF = new Chart(el('chartF'), cfg); }
}

// ═══ Export ═════════════════════════════════════════════════════════════════
// #G10 guard, same rule as the app: a cell starting with = + - @ (or a leading
// tab/CR) is executed as a formula by Excel, Sheets and LibreOffice on open.
const CSV_FORMULA_PREFIXES = ['=', '+', '-', '@', String.fromCharCode(9), String.fromCharCode(13)];
function guardCell(value){
  let s = String(value == null ? '' : value);
  if (s && CSV_FORMULA_PREFIXES.indexOf(s.charAt(0)) !== -1) s = "'" + s;
  return s;
}
function csvCell(v){ return '"' + guardCell(v).replace(/"/g, '""') + '"'; }
function tsvCell(v){ return guardCell(v).replace(/[\t\n\r]/g, ' '); }

const ASSUMPTION_KEYS = {
  start:'fStart', growth:'fGrowth', months:'fMonths', dau:'fDau', ltsales:'fLtSales', ltprice:'fLtPrice',
  ltamort:'fLtAmort', annual:'fAnnual', pages:'fPages', sps:'fSps', uploads:'fUploads', cache:'fCache',
  qpool:'hQpool', qsearch:'hQsearch', qupload:'hQupload', qstats:'hQstats', margin:'fMargin'
};

// One rectangular grid, reused for the CSV file and for the clipboard. Blank
// rows keep the blocks readable once pasted into a sheet.
function buildGrid(){
  if (!lastModel) render();
  const { o, rows, summary, leadIdx } = lastModel;
  const end = rows[rows.length - 1];
  const g = [];
  g.push([t('exTitle')]);
  g.push([t('exGenerated'), new Date().toISOString().slice(0, 10)]);
  g.push([t('exModel'), t('exModelVal')]);
  g.push([t('exLead'), 'm' + leadIdx]);
  g.push([]);
  g.push([t('exAssumptions')]);
  g.push([t('exParam'), t('exValue')]);
  RANGE_IDS.forEach(id => g.push([t(ASSUMPTION_KEYS[id] || id), o[id]]));
  g.push([t('fLtByo'), o.ltbyo ? 'yes' : 'no']);
  g.push([]);
  g.push([t('exMix')]);
  g.push([t('colTier'), t('colShare'), t('colPrice'), t('colReads'), t('colWrites'), t('colSearch')]);
  TIERS.forEach(tier => {
    const p = o.mix[tier.key];
    g.push([t(tier.key), p.share, p.price, p.reads, p.writes, p.search]);
  });
  g.push([]);
  g.push([t('exPlan')]);
  g.push([t('exBucket'), t('exUnit'), t('exLimitNow'), t('exEffToday'), t('exEffH'), t('exGrossH'),
    t('exSatMonth'), t('exRequest')]);
  summary.forEach(s => g.push([s.label, s.unit, Math.round(s.limit), Math.round(s.effNow),
    Math.round(s.effEnd), Math.round(s.grossEnd), s.sat === null ? t('exNotReached') : 'm' + s.sat,
    Math.round(s.request)]));
  g.push([]);
  g.push([t('exRevenue')]);
  g.push([t('thTier'), t('thShare'), t('thUsersH'), t('thPrice'), t('thMrrH'), t('thSearchLoad')]);
  TIERS.forEach(tier => {
    const pt = end.perTier[tier.key], p = o.mix[tier.key];
    g.push([t(tier.key), p.share, Math.round(pt.users), p.price, Math.round(pt.revenue), Math.round(pt.searchCalls)]);
  });
  g.push([t('lifetime'), '', Math.round(end.ltUsers), o.ltprice, Math.round(end.ltMrr), o.ltbyo ? 0 : '']);
  g.push([]);
  g.push([t('exMonthly')]);
  g.push([t('exMonth'), t('exUsers'), t('exDau'), 'Pool eff', 'Pool gross', 'Search eff', 'Search gross',
    'Upload eff', 'Upload gross', 'Stats eff', 'Stats gross',
    t('exMrr'), t('exArr'), t('exCashIn'), t('exCashCum'), t('exArpu')]);
  rows.forEach(r => g.push([r.m, Math.round(r.users), Math.round(r.dau),
    Math.round(r.eff.pool), Math.round(r.gross.pool),
    Math.round(r.eff.search), Math.round(r.gross.search),
    Math.round(r.eff.upload), Math.round(r.gross.upload),
    Math.round(r.eff.stats), Math.round(r.gross.stats),
    Math.round(r.totalMrr), Math.round(r.totalMrr * 12), Math.round(r.cashIn), Math.round(r.cumCash),
    r.users > 0 ? (r.totalMrr / r.users).toFixed(2) : 0]));
  return g;
}

function flash(msg){
  const el2 = el('toast');
  el2.textContent = msg;
  el2.classList.add('on');
  setTimeout(() => el2.classList.remove('on'), 2400);
}

el('btn_csv').addEventListener('click', () => {
  const csv = buildGrid().map(r => r.map(csvCell).join(',')).join('\r\n');
  // BOM so Excel reads the UTF-8 accents instead of mojibake.
  const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url;
  a.download = 'reel-quota-revenue-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash(t('toastCsv'));
});

el('btn_tsv').addEventListener('click', async () => {
  const tsv = buildGrid().map(r => r.map(tsvCell).join('\t')).join('\n');
  try {
    await navigator.clipboard.writeText(tsv);
    flash(t('toastCopy'));
  } catch (e) {
    // The async clipboard needs a secure context: opened straight from disk it
    // refuses, so fall back to the old selection copy.
    const ta = document.createElement('textarea');
    ta.value = tsv; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    flash(ok ? t('toastCopy') : t('toastFail'));
  }
});

// ═══ Language, theme, mode ══════════════════════════════════════════════════
// Every persisted preference is wrapped: private windows and blocked site data
// make localStorage throw rather than return null.
function store(key, value){ try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key){ try { return localStorage.getItem(key); } catch (e) { return null; } }

function applyLang(lang){
  LANG = (lang === 'en') ? 'en' : 'fr';
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(node => {
    node.innerHTML = t(node.getAttribute('data-i18n'));
  });
  el('sub_quota').innerHTML = t('subQuota');
  el('sub_finance').innerHTML = t('subFinance');
  ['notesQ', 'notesF'].forEach(id => {
    el(id).innerHTML = t(id).map(li => '<li>' + li + '</li>').join('');
  });
  document.querySelectorAll('#seg_lang button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === LANG));
  store('reel_estimator_lang', LANG);
  render();
}

function applyTheme(theme){
  const dark = theme !== 'light';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelectorAll('#seg_theme button').forEach(b =>
    b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  store('reel_estimator_theme', dark ? 'dark' : 'light');
  // Chart.js bakes axis and legend colours into the config, so the only way to
  // re-theme a live chart is to throw it away and build it again.
  if (chartQ){ chartQ.destroy(); chartQ = null; }
  if (chartF){ chartF.destroy(); chartF = null; }
  if (lastModel) render();
}

function applyMode(mode){
  MODE = (mode === 'finance') ? 'finance' : 'quota';
  el('view_quota').classList.toggle('hidden', MODE !== 'quota');
  el('view_finance').classList.toggle('hidden', MODE !== 'finance');
  el('sub_quota').classList.toggle('hidden', MODE !== 'quota');
  el('sub_finance').classList.toggle('hidden', MODE !== 'finance');
  document.querySelectorAll('#seg_mode button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === MODE));
  store('reel_estimator_mode', MODE);
  // A chart drawn inside a hidden element gets a zero-width canvas.
  if (MODE === 'finance' && chartF) chartF.resize();
  if (MODE === 'quota' && chartQ) chartQ.resize();
}

function setPreset(name){
  const p = PRESETS[name];
  if (!p) return;
  RANGE_IDS.forEach(id => { if (p[id] !== undefined) el(id).value = p[id]; });
  el('ltbyo').checked = !!p.ltbyo;
  TIERS.forEach(tier => {
    const vals = p.mix[tier.key];
    TIER_FIELDS.forEach((f, i) => el(tierInputId(tier.key, f)).value = vals[i]);
  });
  render();
}

buildMixRows();
RANGE_IDS.forEach(id => el(id).addEventListener('input', render));
el('ltbyo').addEventListener('change', render);
TIERS.forEach(tier => TIER_FIELDS.forEach(f =>
  el(tierInputId(tier.key, f)).addEventListener('input', render)));
document.querySelectorAll('.preset').forEach(b =>
  b.addEventListener('click', () => setPreset(b.dataset.preset)));
document.querySelectorAll('#seg_lang button').forEach(b =>
  b.addEventListener('click', () => applyLang(b.dataset.lang)));
document.querySelectorAll('#seg_theme button').forEach(b =>
  b.addEventListener('click', () => applyTheme(b.dataset.theme)));
document.querySelectorAll('#seg_mode button').forEach(b =>
  b.addEventListener('click', () => applyMode(b.dataset.mode)));

const savedTheme = recall('reel_estimator_theme');
applyTheme(savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
setPreset('base');
applyLang(recall('reel_estimator_lang') || ((navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr'));
applyMode(recall('reel_estimator_mode') || 'quota');
</script>
